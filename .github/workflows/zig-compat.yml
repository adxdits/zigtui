name: Zig Compatibility Check

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  zig-compat:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch latest stable Zig version
        id: fetch
        run: |
          VERSION=$(curl -s https://ziglang.org/download/index.json | jq -r 'keys[] | select(test("^[0-9]"))' | sort -V | tail -1) # Grab latest stable version
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4

      - name: Read minimum Zig version
        id: min-version
        run: |
          MIN_VERSION=$(grep -oP 'minimum_zig_version\s*=\s*"\K[^"]+' build.zig.zon || echo "0.0.0")
          echo "min=$MIN_VERSION" >> $GITHUB_OUTPUT

      - name: Check version compatibility
        id: compat
        run: |
          LATEST="${{ steps.fetch.outputs.version }}"
          MIN="${{ steps.min-version.outputs.min }}"
          LATEST_MAJOR=$(echo "$LATEST" | cut -d. -f1-2)
          MIN_MAJOR=$(echo "$MIN" | cut -d. -f1-2)
          if [ "$LATEST_MAJOR" != "$MIN_MAJOR" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Zig $LATEST is a different minor series than minimum $MIN — skipping (breaking release)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore cached version
        if: steps.compat.outputs.skip != 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-version-cache
          key: zig-version-${{ steps.fetch.outputs.version }}

      - name: Check if already tested
        if: steps.compat.outputs.skip != 'true' && steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "Already tested Zig ${{ steps.fetch.outputs.version }}, skipping"

      - name: Setup Zig
        if: steps.compat.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: korandoru/setup-zig@v1
        with:
          zig-version: ${{ steps.fetch.outputs.version }}

      - name: Build and Test
        if: steps.compat.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          zig version
          zig build examples
          zig build test

      - name: Create cache marker
        if: steps.compat.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: echo "${{ steps.fetch.outputs.version }}" > .zig-version-cache

      - name: Save cache
        if: steps.compat.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .zig-version-cache
          key: zig-version-${{ steps.fetch.outputs.version }}
